spring.application.name=businfo-api
server.port=${PORT:3000}

# Banco de dados SQLite. Os parametros da URL sao os PRAGMAs de desempenho (RNF01).
businfo.database.path=database/businfo.db
spring.datasource.url=jdbc:sqlite:${businfo.database.path}?journal_mode=WAL&synchronous=NORMAL&foreign_keys=on&temp_store=MEMORY&cache_size=-8000&busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# true = apaga e recria o banco com a carga inicial ao subir
businfo.database.reset=false

# Cache em memoria das rotas de leitura
businfo.cache.ttl=60s

# JSON: mantem a ordem dos campos declarada nas classes
spring.jackson.mapper.sort-properties-alphabetically=false
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true

# Documentacao OpenAPI / Swagger UI (RNF05)
springdoc.api-docs.path=/api/v1/openapi.json
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.deep-linking=true
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false

logging.charset.console=UTF-8
